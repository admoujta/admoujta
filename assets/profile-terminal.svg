  <circle cx="60" cy="40" r="5" fill="#94a3b8"/>
  <circle cx="78" cy="40" r="5" fill="#cbd5e1"/>
  <text x="560" y="45" text-anchor="middle" fill="#6f89ab" class="mono" font-size="12">admoujta@github: ~/profile — production mode</text>
