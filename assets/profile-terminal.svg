<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="552" viewBox="0 0 1120 552" role="img" aria-label="Adam Moujtahid GitHub profile terminal card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="45%" stop-color="#0b1730"/>
      <stop offset="100%" stop-color="#040c18"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17335f"/>
      <stop offset="50%" stop-color="#264f86"/>
      <stop offset="100%" stop-color="#102948"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78a9ff"/>
      <stop offset="100%" stop-color="#b9d2ff"/>
    </linearGradient>
    <linearGradient id="scanFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fc3ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9fc3ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#9fc3ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="1119" height="551" rx="16"/>
    </clipPath>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0f203b" stroke-width="1" opacity="0.45"/>
    </pattern>
    <style><![CDATA[
      .mono { font-family: Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
      .titlePulse { animation: titlePulse 3s ease-in-out infinite; }
      .cursor { animation: blink 1s steps(1,end) infinite; }
      .scanline { animation: scan 8s linear infinite; }
      .glowPulse { animation: glowPulse 2.8s ease-in-out infinite; }
      .floatSoft { animation: floatSoft 4.5s ease-in-out infinite; }
      .shineBar { animation: blinkSoft 1.6s ease-in-out infinite; }
      @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
      @keyframes blinkSoft { 0%,100% { opacity:1; } 50% { opacity:.45; } }
      @keyframes titlePulse { 0%,100% { opacity:1; } 50% { opacity:.78; } }
      @keyframes glowPulse { 0%,100% { opacity:1; filter:url(#softGlow); } 50% { opacity:.8; filter:url(#softGlow); } }
      @keyframes scan { 0% { transform:translateY(-90px); } 100% { transform:translateY(660px); } }
      @keyframes floatSoft { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-2px); } }
    ]]></style>
  </defs>

  <rect x="0.5" y="0.5" width="1119" height="551" rx="16" fill="url(#bg)" stroke="url(#border)" stroke-width="1.5"/>
  <rect x="12" y="12" width="1096" height="528" rx="12" fill="url(#grid)" opacity="0.35"/>

  <g clip-path="url(#cardClip)">
    <rect class="scanline" x="0" y="-90" width="1120" height="90" fill="url(#scanFade)" opacity="0.38"/>
  </g>

  <rect x="20" y="18" width="1080" height="44" rx="10" fill="#07111c" stroke="#122743"/>
