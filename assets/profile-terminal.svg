  <defs id="animated-profile-style">
    <linearGradient id="scanFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .pulseSlow { animation: pulse 3.2s ease-in-out infinite; }
      .cursor { animation: blink 1s steps(1,end) infinite; }
      .scanline { animation: scan 7s linear infinite; }
      .portfolioGlow { animation: glowPulse 2.8s ease-in-out infinite; }
      .asciiFloat { animation: floaty 4s ease-in-out infinite; transform-origin: center; }
      @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
      @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.72; } }
      @keyframes glowPulse { 0%,100% { opacity:1; filter:url(#softGlow); } 50% { opacity:.78; filter:url(#softGlow); } }
      @keyframes scan { 0% { transform:translateY(-90px); } 100% { transform:translateY(650px); } }
      @keyframes floaty { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-2px); } }
    ]]></style>
  </defs>
